# =============================================================================
# Docker Compose — Production Environment
# =============================================================================
# Architecture:
#
# Internet
#    ↓
# Cloudflare
#    ↓
# Apache httpd :80 / :443
#    ↓
# 127.0.0.1:8000
#    ↓
# Docker Django/Gunicorn
#    ↓
# PostgreSQL + Redis
#
# Domain:
#   pos.dyca.vn
#
# Apache làm Reverse Proxy cho Django.
# Apache cũng phục vụ trực tiếp:
#   /static/
#   /media/
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: pos_db_prod
    restart: always

    volumes:
      - postgres_data_prod:/var/lib/postgresql/data

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    # -------------------------------------------------------------------------
    # Cho phép Navicat từ bên ngoài VPS kết nối PostgreSQL.
    #
    # Nếu muốn bảo mật hơn, có thể đổi thành:
    #   127.0.0.1:5432:5432
    # và dùng SSH Tunnel trong Navicat.
    # -------------------------------------------------------------------------
    ports:
      - "5432:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  # ---------------------------------------------------------------------------
  # Redis Cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: pos_redis_prod
    restart: always

    volumes:
      - redis_data_prod:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s


  # ---------------------------------------------------------------------------
  # Django Backend
  # Production — Gunicorn
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production

    container_name: pos_backend_prod
    restart: always

    # -------------------------------------------------------------------------
    # Chỉ expose Django trên localhost của VPS.
    # Apache bên ngoài Docker reverse proxy vào port này.
    # Không expose Django trực tiếp ra Internet.
    # -------------------------------------------------------------------------
    ports:
      - "127.0.0.1:8000:8000"

    # -------------------------------------------------------------------------
    # Host directories
    #
    # Apache bên ngoài Docker có thể đọc static/media trực tiếp.
    # -------------------------------------------------------------------------
    volumes:

      # Django collectstatic
      - /var/www/pos-management/staticfiles:/app/staticfiles

      # User uploaded media
      - /var/www/pos-management/media:/app/media

      # Application logs
      - /var/www/pos-management/logs:/app/logs

    env_file:
      - .env

    environment:

      # Django
      DJANGO_SETTINGS_MODULE: config.settings.production

      # PostgreSQL — Docker internal network
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432

      # Redis — Docker internal network
      REDIS_URL: redis://redis:6379/0

    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_healthy


# =============================================================================
# Persistent Docker Volumes
# =============================================================================

volumes:

  # PostgreSQL persistent database
  postgres_data_prod:

  # Redis persistent data
  redis_data_prod:
