<aside class="workspace-sidebar" aria-label="Điều hướng quản trị">
  <a class="workspace-nav-item {% if active_module == 'overview' %}is-active{% endif %}"
     href="{% url 'dashboard:index' %}">
    Tổng quan
  </a>
  {% if can_view_product %}
    <a class="workspace-nav-item {% if active_module == 'product' %}is-active{% endif %}"
       href="{% url 'dashboard:product-list' %}">
      Sản phẩm
    </a>
  {% endif %}
  {% if can_view_inventory %}
    <a class="workspace-nav-item {% if active_module == 'inventory' %}is-active{% endif %}"
       href="{% url 'dashboard:inventory-list' %}">
      Kho hàng
    </a>
  {% endif %}
  {% if can_view_report %}
    <a class="workspace-nav-item" href="{% url 'dashboard:report-dashboard' %}">
      Báo cáo
    </a>
  {% endif %}
</aside>
