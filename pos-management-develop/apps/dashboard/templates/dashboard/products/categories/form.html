<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container py-4" style="max-width: 600px;">
    <h2>{{ title }}</h2>
    <form method="post" class="card p-4 shadow-sm">
        {% csrf_token %}
        {% if form.instance.pk %}
            <div class="mb-3">
                <label class="form-label fw-bold">UUID</label>
                <p class="form-control-plaintext font-monospace text-muted mb-0">{{ form.instance.id }}</p>
            </div>
        {% endif %}
        {{ form.as_p }}
        <div class="mt-3">
            <button class="btn btn-success" type="submit">Lưu</button>
            <a class="btn btn-secondary" href="{% url 'category-list' %}">Quay lại</a>
        </div>
    </form>
</body>
</html>
